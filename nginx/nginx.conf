# "app" resolves through Docker's DNS to every replica; Nginx round-robins between them.
upstream calculator_api {
    zone calculator_api 64k;  # shared state, so all worker processes round-robin together
    server app:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://calculator_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Shows which replica answered (handy for the demo).
        add_header X-Upstream $upstream_addr always;
    }
}
