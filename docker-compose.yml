# Full stack: Nginx reverse proxy -> 2 replicas of the calculator API.
# Jenkins deploys with: DOCKER_IMAGE=<user>/calculator IMAGE_TAG=<build no.> docker compose up -d --wait
name: calculator

services:
  app:
    image: ${DOCKER_IMAGE:-calculator}:${IMAGE_TAG:-latest}
    deploy:
      replicas: 2
    environment:
      SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    # No host port: the API is only reachable through Nginx.
    expose:
      - "8080"
    healthcheck:
      # Runs inside the container; Alpine ships busybox wget, not curl.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - calc-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
